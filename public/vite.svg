<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2" />

  <!-- Subtle DSP Grid Lines -->
  <line x1="24" y1="96" x2="168" y2="96" stroke="#1f293b" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="96" y1="28" x2="96" y2="164" stroke="#1f293b" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Tapered Window Envelope (Hann Window outline, top & bottom) -->
  <path d="M 28 96 C 56 46, 136 46, 164 96" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
  <path d="M 28 96 C 56 146, 136 146, 164 96" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />

  <!-- Windowed Sinusoid Waveform (Modulated carrier wave) -->
  <path d="M 28 96 
           Q 37 92, 45 96 T 63 96 
           C 70 80, 75 72, 81 96 
           C 87 122, 91 128, 96 96 
           C 102 64, 107 58, 113 96 
           C 119 126, 123 130, 129 96 
           C 134 76, 139 72, 147 96 
           T 164 96" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Center Focal Marker (Spectral peak dot) -->
  <circle cx="96" cy="96" r="3.5" fill="#38bdf8" />
</svg>
